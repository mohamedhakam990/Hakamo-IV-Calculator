name: Build Hakamo Nursing Assistant V8

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ZIP_FILE: HakamoNursingAssistant-V8-CLEAN.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found"
            ls -la
            exit 1
          }

          rm -rf extracted project
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          test -n "$SETTINGS_FILE" || {
            echo "ERROR: Gradle project not found in ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          mv "$PROJECT_DIR" project

          test -f project/app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts not found"
            find project -maxdepth 3 -type f
            exit 1
          }

      - name: Configure AndroidX
        working-directory: project
        shell: bash
        run: |
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts

      - name: Clean project
        working-directory: project
        run: gradle clean --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: APK was not generated"
            find project/app/build -type f | head -100
            exit 1
          }

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V8
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
