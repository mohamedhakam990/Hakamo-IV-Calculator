name: Build Hakamo Nursing Assistant V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract V5 project
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V5-Final-Glass-Logo.zip"

          if [ ! -f "$ZIP" ]; then
            echo "V5 ZIP not found!"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf extracted project
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          if [ ! -d "extracted/HakamoIVCalculator" ]; then
            echo "Project folder not found inside ZIP!"
            find extracted -maxdepth 3 -type f -print
            exit 1
          fi

          mv extracted/HakamoIVCalculator project

      - name: Configure AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "AndroidX configured successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        working-directory: project
        run: |
          echo "Project files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -name "*.gradle*" -o -name "gradlew"

      - name: Clean project
        working-directory: project
        run: |
          gradle clean --no-daemon

      - name: Build V5 APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V5
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
