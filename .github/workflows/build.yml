name: Build Hakamo Nursing Assistant V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract V4 project
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V4-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name 'HakamoNursingAssistant-V4-*.zip' | head -n 1)
          fi

          echo "Using: $ZIP"

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          mv extracted/HakamoIVCalculator project

      - name: Enable AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check AndroidX
        working-directory: project
        run: |
          grep -E 'android.useAndroidX|android.enableJetifier' gradle.properties

      - name: Build APK
        working-directory: project
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V4-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
