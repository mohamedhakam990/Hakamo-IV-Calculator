name: Hakamo Nursing Assistant V8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find V8 ZIP
        shell: bash
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V8-Nursing-Guide.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V8 ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP"

      - name: Extract V8 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted project
          mkdir extracted

          unzip -q "HakamoNursingAssistant-V8-Nursing-Guide.zip" -d extracted

          PROJECT_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          mv "$PROJECT_DIR" project

          echo "Project directory:"
          ls -la project

      - name: Configure AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

      - name: Clean
        working-directory: project
        run: |
          gradle clean --no-daemon

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          APK=$(find project -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find project -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V8
          path: project/**/*.apk
          if-no-files-found: error
