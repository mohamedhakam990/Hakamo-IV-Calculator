name: Build Hakamo Nursing Assistant V4

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V4 project
        run: |
          unzip -q HakamoNursingAssistant-V4-Bilingual.zip -d extracted
          mv extracted/HakamoIVCalculator project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build V4 APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V4
          path: project/app/build/outputs/apk/debug/app-debug.apk
