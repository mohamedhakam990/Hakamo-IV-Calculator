name: Build Hakamo IV Calculator Pro

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Pro project
        run: |
          unzip -q HakamoIVCalculator-Pro-v2.zip -d extracted
          mv extracted/HakamoIVCalculator project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Pro APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-IV-Calculator-Pro
          path: project/app/build/outputs/apk/debug/app-debug.apk
