name: Build Hakamo Nursing Assistant V8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find V8 ZIP
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V8-Nursing-Guide.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V8 ZIP not found!"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP"

      - name: Extract Android Project
        run: |
          set -e

          rm -rf extracted project
          mkdir extracted

          unzip -q "HakamoNursingAssistant-V8-Nursing-Guide.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          if [ -d "extracted/HakamoIVCalculator" ]; then
            mv extracted/HakamoIVCalculator project
          else
            PROJECT_DIR=$(find extracted \
              -name "settings.gradle.kts" \
              -o -name "settings.gradle" \
              | head -1 \
              | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found!"
              exit 1
            fi

            mv "$PROJECT_DIR" project
          fi

      - name: Configure AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          echo "AndroidX configured successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project
        working-directory: project
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Clean Project
        working-directory: project
        run: |
          gradle clean --no-daemon

      - name: Build V8 APK
        working-directory: project
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          if [ ! -f "project/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated!"
            find project/app/build -type f | head -100
            exit 1
          fi

          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V8
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
