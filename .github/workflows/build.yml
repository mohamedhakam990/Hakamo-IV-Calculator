name: Hakamo Nursing Assistant V8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: فك نسخة V8
        shell: bash
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V8-Nursing-Guide.zip"

          if [ ! -f "$ZIP" ]; then
            echo "❌ الملف غير موجود:"
            echo "$ZIP"
            echo ""
            echo "الملفات الموجودة:"
            ls -lah
            exit 1
          fi

          rm -rf project extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "📂 محتويات الملف:"
          find extracted -maxdepth 3 -type f | head -100

          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "❌ لم يتم العثور على مشروع Android"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          mv "$PROJECT_DIR" project

          echo "✅ المشروع:"
          pwd
          ls -la project

      - name: إعداد AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: تنظيف المشروع
        working-directory: project
        run: |
          gradle clean --no-daemon

      - name: بناء APK
        working-directory: project
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: التأكد من APK
        run: |
          echo "🔍 البحث عن APK..."

          find project -type f -name "*.apk" -print

          APK=$(find project -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            exit 1
          fi

          echo "✅ APK جاهز:"
          ls -lh "$APK"

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V8
          path: project/**/*.apk
          if-no-files-found: error        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          if [ ! -f "project/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated!"
            find project/app/build -type f | head -100
            exit 1
          fi

          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V8
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
