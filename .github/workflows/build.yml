name: Build Hakamo Nursing Assistant V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V5 project
        run: |
          set -e

          ZIP="HakamoNursingAssistant-V5-Contact-Links.zip"

          if [ ! -f "$ZIP" ]; then
            echo "V5 ZIP not found!"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP"

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          mv extracted/HakamoIVCalculator project

      - name: Configure AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean project
        working-directory: project
        run: gradle clean --no-daemon

      - name: Build V5 APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V5
          path: project/app/build/outputs/apk/debug/app-debug.apk
